<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光伏能源管理平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='5' fill='%23eda100'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
    <span>光伏能源管理平台</span>
  </div>
  <div class="topbar-actions">
    <label class="sr-only" for="stationSelect">选择电站</label>
    <select id="stationSelect"></select>
    <button class="icon-btn" id="themeBtn" title="切换深色/浅色" aria-label="切换深色/浅色"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-view="dashboard">概览</button>
  <button class="tab" data-view="monitor">电站监控</button>
  <button class="tab" data-view="alarms">告警<span class="tab-badge hidden" id="alarmBadge"></span></button>
  <button class="tab" data-view="entry">数据录入</button>
  <button class="tab" data-view="stations">电站管理</button>
</nav>

<main>
  <!-- 概览 -->
  <section id="view-dashboard" class="view active">
    <div id="emptyState" class="card empty hidden">
      <h2>还没有电站</h2>
      <p>先添加你的光伏电站，然后录入每天的发电量；也可以生成演示数据先体验一下。</p>
      <div class="row-gap">
        <button class="btn primary" data-goto="stations">添加电站</button>
        <button class="btn" id="demoBtn">生成演示数据</button>
      </div>
    </div>

    <button class="status-strip hidden" id="statusStrip" data-goto="monitor"></button>
    <div class="kpis" id="kpis"></div>

    <div class="card">
      <div class="card-head">
        <div class="seg" role="tablist" id="periodSeg">
          <button class="active" data-period="daily">日发电量</button>
          <button data-period="monthly">月发电量</button>
          <button data-period="yearly">年发电量</button>
        </div>
        <div class="period-ctrl">
          <button class="icon-btn" id="prevBtn" title="上一个">‹</button>
          <input type="month" id="monthInput">
          <input type="number" id="yearInput" min="2000" max="2100" class="hidden">
          <button class="icon-btn" id="nextBtn" title="下一个">›</button>
        </div>
      </div>
      <h3 id="chartTitle" class="chart-title"></h3>
      <div class="stats-row" id="periodStats"></div>
      <div id="legend" class="legend"></div>
      <div class="chart-wrap" id="chart"></div>
      <details class="table-toggle">
        <summary>查看数据表</summary>
        <div class="table-scroll"><table id="periodTable"></table></div>
      </details>
    </div>
  </section>

  <!-- 电站监控 -->
  <section id="view-monitor" class="view">
    <div class="mon-totals" id="monTotals"></div>
    <div class="chips" id="monChips"></div>
    <div class="mon-ctrl">
      <input type="search" id="monSearch" placeholder="搜索电站名称 / 地址">
      <select id="monSort">
        <option value="status">按状态</option>
        <option value="today_hours">按今日等效小时</option>
        <option value="today_kwh">按今日发电量</option>
        <option value="power_w">按实时功率</option>
        <option value="month_kwh">按本月发电量</option>
        <option value="active_alarms">按告警数</option>
        <option value="name">按名称</option>
      </select>
    </div>
    <p class="hint" id="monHint"></p>
    <div class="mon-list" id="monList"></div>
  </section>

  <!-- 告警 -->
  <section id="view-alarms" class="view">
    <div class="card">
      <div class="card-head">
        <h2>告警中心</h2>
        <div class="seg" id="alarmSeg">
          <button class="active" data-active="1">进行中</button>
          <button data-active="0">全部</button>
        </div>
      </div>
      <p class="hint">告警来自固德威云平台，每次同步时更新。</p>
      <div class="alarm-list" id="alarmList"></div>
    </div>
  </section>

  <!-- 数据录入 -->
  <section id="view-entry" class="view">
    <div class="grid-2">
      <div class="card">
        <h2>录入日发电量</h2>
        <form id="recordForm" class="form">
          <label>电站<select name="station_id" required></select></label>
          <label>日期<input type="date" name="day" required></label>
          <label>发电量 (kWh)<input type="number" name="kwh" step="0.01" min="0" required placeholder="例如 186.5"></label>
          <label>备注<input type="text" name="note" placeholder="可选，例如：阴雨、清洗组件"></label>
          <button class="btn primary" type="submit">保存</button>
          <p class="hint">同一电站同一天重复录入会覆盖原有数据。</p>
        </form>
      </div>
      <div class="card">
        <h2>批量导入 / 导出</h2>
        <form id="importForm" class="form">
          <label>电站<select name="station_id" required></select></label>
          <label>CSV 文件<input type="file" name="file" accept=".csv,.txt"></label>
          <label>或直接粘贴（每行：日期,发电量）
            <textarea name="csv" rows="6" placeholder="2024-06-01,210.5&#10;2024-06-02,198.3"></textarea>
          </label>
          <button class="btn primary" type="submit">导入</button>
        </form>
        <div class="row-gap" style="margin-top:12px">
          <a class="btn" id="exportLink" href="/api/export">导出明细 CSV（当前电站）</a>
        </div>
        <h3 class="sub-h">电站报表</h3>
        <div class="row-gap report-row">
          <input type="month" id="reportMonth">
          <a class="btn" id="reportMonthLink" href="#">导出月报</a>
          <a class="btn" id="reportYearLink" href="#">导出年报</a>
        </div>
        <p class="hint">每座电站的发电量、等效利用小时、收益和减排量，Excel 可直接打开。</p>
      </div>
    </div>
    <div class="card" id="syncCard">
      <div class="card-head">
        <h2>固德威自动同步</h2>
        <div class="row-gap">
          <button class="btn" id="discoverBtn">从固德威导入电站</button>
          <button class="btn" id="backfillBtn">补录历史数据</button>
          <button class="btn" id="syncBtn">立即同步</button>
        </div>
      </div>
      <p id="syncMsg" class="sync-msg"></p>
      <p id="backfillMsg" class="sync-msg hidden"></p>
      <div class="table-scroll"><table id="syncTable"></table></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>最近记录</h2>
        <div class="period-ctrl">
          <input type="month" id="recordsMonth">
        </div>
      </div>
      <div class="table-scroll"><table id="recordsTable"></table></div>
    </div>
  </section>

  <!-- 电站管理 -->
  <section id="view-stations" class="view">
    <div class="grid-2">
      <div class="card">
        <h2 id="stationFormTitle">添加电站</h2>
        <form id="stationForm" class="form">
          <input type="hidden" name="id">
          <label>电站名称<input name="name" required placeholder="例如：家庭屋顶电站"></label>
          <label>装机容量 (kWp)<input type="number" name="capacity_kwp" step="0.01" min="0" required></label>
          <label>上网电价 / 收益单价 (元/kWh)<input type="number" name="price" step="0.0001" min="0" value=""></label>
          <label>地址<input name="location" placeholder="可选"></label>
          <label>并网日期<input type="date" name="commission_date"></label>
          <label>备注<input name="notes" placeholder="可选"></label>
          <label>固德威电站 ID（自动同步用，可选）
            <input name="goodwe_station_id" placeholder="SEMS 网页版电站页面网址中的 ID">
          </label>
          <div class="row-gap">
            <button class="btn primary" type="submit">保存</button>
            <button class="btn hidden" type="button" id="stationCancel">取消编辑</button>
          </div>
        </form>
      </div>
      <div class="card">
        <h2>我的电站</h2>
        <form id="priceForm" class="price-form">
          <label>统一电价（元/kWh）<input type="number" name="price" step="0.0001" min="0" required placeholder="例如 0.2829"></label>
          <button class="btn" type="submit">应用到所有电站</button>
        </form>
        <div class="table-scroll"><table id="stationsTable"></table></div>
      </div>
    </div>
    <div class="card" id="notifyCard">
      <h2>微信通知</h2>
      <form id="notifyForm" class="form notify-form">
        <label>推送方式
          <select name="notify_channel">
            <option value="">不推送</option>
            <option value="wxpusher">WxPusher（免费，发到个人微信）</option>
            <option value="pushplus">PushPlus 推送加（发到个人微信，需实名）</option>
            <option value="wecom">企业微信群机器人（发到企业微信群）</option>
            <option value="serverchan">Server酱</option>
          </select>
        </label>
        <p class="hint" id="notifyHelp"></p>
        <label><span id="tokenLabel">Token</span>
          <input name="notify_token" autocomplete="off" placeholder="">
        </label>
        <label class="hidden" id="uidsRow">接收人 UID（多个用逗号分隔）<input name="notify_uids" placeholder="UID_xxx"></label>
        <fieldset class="checks">
          <legend>通知内容</legend>
          <label><input type="checkbox" name="notify_alarm"> 新告警（固德威上报的设备故障/告警）</label>
          <label><input type="checkbox" name="notify_recovery"> 告警恢复</label>
          <label><input type="checkbox" name="notify_status"> 电站故障、白天离线（其他电站正常发电时），以及恢复正常</label>
          <label><input type="checkbox" name="notify_daily"> 每日发电日报，发送时间 <input type="time" name="notify_daily_time" class="inline-time"></label>
        </fieldset>
        <label>不推送的告警（每行一个关键词，告警名称包含即不推送；仍会记录在「告警」页）
          <textarea name="notify_mute" rows="3" placeholder="例如：DC侧SPD故障"></textarea>
        </label>
        <label>白天时段（3 座以上电站时自动按“大部分电站在发电”判断白天；电站少于 3 座时按此时段提醒离线）
          <span class="row-gap"><input type="time" name="notify_day_start" class="inline-time"> 至 <input type="time" name="notify_day_end" class="inline-time"></span>
        </label>
        <div class="row-gap">
          <button class="btn primary" type="submit">保存</button>
          <button class="btn" type="button" id="notifyTest">发送测试消息</button>
          <button class="btn" type="button" id="notifyDaily">立即发送今日日报</button>
        </div>
        <p class="hint" id="notifyLast"></p>
      </form>
    </div>
  </section>
</main>

<div id="tooltip" class="tooltip hidden" role="status"></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
